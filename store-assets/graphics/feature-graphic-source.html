<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
        font-family: 'Segoe UI', Poppins, sans-serif;
    }
    .bg {
        width: 1024px;
        height: 500px;
        background: linear-gradient(135deg, #F0472F 0%, #C81A0F 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
        position: relative;
    }
    .icon {
        width: 220px;
        height: 220px;
        border-radius: 48px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        flex-shrink: 0;
    }
    .text {
        color: white;
        text-align: left;
    }
    .text h1 {
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.01em;
    }
    .text p {
        margin-top: 12px;
        font-size: 28px;
        font-weight: 400;
        color: rgba(255,255,255,0.92);
    }
</style>
</head>
<body>
    <div class="bg">
        <img class="icon" src="icon-512.png" alt="">
        <div class="text">
            <h1>Narraity</h1>
            <p>Write your novel. Own your data.</p>
        </div>
    </div>
</body>
</html>
