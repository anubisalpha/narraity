name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows, not the cheaper ubuntu-latest: the test suite loads real
    # vendored native libraries (libhunspell.dll, libvosk.dll) via dart:ffi,
    # which are Windows binaries — see hunspell_ffi.dart/vosk_ffi.dart.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
